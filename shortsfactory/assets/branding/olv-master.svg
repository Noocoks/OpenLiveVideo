<style>
.emblem{animation:enter 1.15s cubic-bezier(.18,.75,.22,1) both}
.playFace{transform-box:fill-box;transform-origin:center;animation:playPulse 2.6s ease-in-out infinite}
.lightA{animation:flickerA 2.7s ease-in-out infinite}
.lightB{animation:flickerB 3.8s ease-in-out infinite}
.lightC{animation:flickerC 4.3s ease-in-out infinite}
.lightD{animation:flickerD 3.2s ease-in-out infinite}
.ambient{transform-origin:center;animation:ambient 11s ease-in-out infinite alternate}
.orbit{transform-origin:627px 620px;animation:orbit 52s linear infinite}
.spark{animation:spark 2.4s ease-in-out infinite alternate}
@keyframes enter{from{opacity:0;transform:translateY(15px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes playPulse{0%,100%{filter:drop-shadow(0 0 5px #f20b16)}50%{filter:drop-shadow(0 0 19px #ff2525)}}
@keyframes flickerA{0%,100%{opacity:.68}8%{opacity:1}12%{opacity:.55}18%{opacity:.96}54%{opacity:.72}58%{opacity:.32}63%{opacity:1}80%{opacity:.75}}
@keyframes flickerB{0%,100%{opacity:.42}24%{opacity:.9}27%{opacity:.3}31%{opacity:1}66%{opacity:.58}72%{opacity:.95}}
@keyframes flickerC{0%,100%{opacity:.35}16%{opacity:.8}21%{opacity:.4}48%{opacity:1}51%{opacity:.45}56%{opacity:.88}}
@keyframes flickerD{0%,100%{opacity:.5}36%{opacity:1}39%{opacity:.25}44%{opacity:.85}76%{opacity:.42}82%{opacity:.95}}
@keyframes ambient{from{opacity:.48;transform:scale(.96)}to{opacity:.9;transform:scale(1.06)}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes spark{from{opacity:.25}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.emblem,.playFace,.lightA,.lightB,.lightC,.lightD,.ambient,.orbit,.spark{animation:none!important}}
</style>
