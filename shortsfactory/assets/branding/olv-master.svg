  <filter id="glowSmall" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="smoke" x="-30%" y="-30%" width="160%" height="160%"><feTurbulence type="fractalNoise" baseFrequency=".009 .025" numOctaves="3" seed="9" result="noise"/><feColorMatrix in="noise" type="saturate" values="0" result="gray"/><feComponentTransfer in="gray"><feFuncR type="table" tableValues="0 .08 .2 .38 .62"/><feFuncG type="table" tableValues="0 .07 .15 .24 .34"/><feFuncB type="table" tableValues="0 .07 .12 .18 .23"/><feFuncA type="table" tableValues="0 .03 .12 .24 .4"/></feComponentTransfer><feGaussianBlur stdDeviation="9"/></filter>
