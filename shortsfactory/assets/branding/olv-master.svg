<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" role="img" aria-labelledby="title desc">
<title id="title">OLV — Emblema maestro</title>
<desc id="desc">Emblema OLV de acero forjado oscuro con aro circular segmentado, núcleo triangular rojo incandescente, reflejos metálicos, humo y energía roja animada.</desc>
<metadata>OLV master emblem. Reconstructed vector artwork with animated red illumination.</metadata>
<defs>
  <radialGradient id="bg" cx="50%" cy="45%" r="76%"><stop stop-color="#10090a"/><stop offset=".46" stop-color="#050405"/><stop offset="1" stop-color="#010102"/></radialGradient>
  <radialGradient id="redFog"><stop stop-color="#ff1019" stop-opacity=".72"/><stop offset=".25" stop-color="#c50915" stop-opacity=".43"/><stop offset=".58" stop-color="#65070d" stop-opacity=".2"/><stop offset="1" stop-color="#190205" stop-opacity="0"/></radialGradient>
  <linearGradient id="metal" x1=".1" y1="0" x2=".85" y2="1"><stop stop-color="#f0e9e6"/><stop offset=".12" stop-color="#aaa2a0"/><stop offset=".25" stop-color="#4a4547"/><stop offset=".4" stop-color="#c7bfbb"/><stop offset=".55" stop-color="#625b5b"/><stop offset=".72" stop-color="#292629"/><stop offset=".88" stop-color="#b4aaa6"/><stop offset="1" stop-color="#484144"/></linearGradient>
  <linearGradient id="metalFace" x1="0" y1="0" x2=".75" y2="1"><stop stop-color="#c9c0bc"/><stop offset=".13" stop-color="#817a79"/><stop offset=".31" stop-color="#383437"/><stop offset=".5" stop-color="#aaa19e"/><stop offset=".67" stop-color="#4b4548"/><stop offset=".84" stop-color="#242124"/><stop offset="1" stop-color="#777071"/></linearGradient>
  <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5a5354"/><stop offset=".28" stop-color="#171518"/><stop offset=".7" stop-color="#080709"/><stop offset="1" stop-color="#393235"/></linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fff0df"/><stop offset=".09" stop-color="#ff9b7d"/><stop offset=".22" stop-color="#ff392d"/><stop offset=".43" stop-color="#e80c17"/><stop offset=".72" stop-color="#97050e"/><stop offset="1" stop-color="#260205"/></linearGradient>
  <linearGradient id="redRim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff2e9"/><stop offset=".2" stop-color="#ff4a3e"/><stop offset=".55" stop-color="#ff101b"/><stop offset="1" stop-color="#65040a"/></linearGradient>
