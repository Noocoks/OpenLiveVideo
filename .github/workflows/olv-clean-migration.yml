name: OLV clean migration to public repository

on:
  workflow_dispatch:
    inputs:
      publish_now:
        description: "Publicar después de preparar y auditar la copia"
        required: true
        type: boolean
        default: false
      confirmation:
        description: 'Escribe exactamente PUBLISH para autorizar la publicación'
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: olv-public-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Prepare, audit and optionally publish OLV
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TARGET_BRANCH: main
      CONFIRMATION: ${{ inputs.confirmation }}

    steps:
      - name: Check source access secret
        env:
          SOURCE_TOKEN: ${{ secrets.OLV_SOURCE_TOKEN }}
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo "::error::Falta el secreto OLV_SOURCE_TOKEN en Settings > Secrets and variables > Actions."
            echo "Crea un fine-grained token con Contents: Read-only para Noocoks/OpenLiveVideo_OLV y guárdalo como OLV_SOURCE_TOKEN."
            exit 1
          fi

      - name: Checkout private source branch
        uses: actions/checkout@v4
        with:
          repository: Noocoks/OpenLiveVideo_OLV
          ref: ui/minimalist-installer-agpl-ci
          token: ${{ secrets.OLV_SOURCE_TOKEN }}
          path: source
          fetch-depth: 1
          lfs: true

      - name: Checkout current public workflow
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: main
          token: ${{ github.token }}
          path: bootstrap
          fetch-depth: 1

      - name: Verify source and destination state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Private source commit:"
          git -C source rev-parse HEAD
          refs="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git")"
          expected="${GITHUB_SHA}	refs/heads/main"
          if [ "$refs" != "$expected" ]; then
            echo "::error::La rama main ha cambiado desde el inicio del workflow. No se sobrescribirá."
            printf '%s\n' "$refs"
            exit 1
          fi
          echo "Destino verificado en el SHA del workflow: ${GITHUB_SHA}"

      - name: Build clean publication tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir clean
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.DS_Store' \
            --exclude='Thumbs.db' \
            --exclude='desktop.ini' \
            --exclude='__pycache__/' \
            --exclude='*.py[cod]' \
            --exclude='.pytest_cache/' \
            --exclude='.mypy_cache/' \
            --exclude='.ruff_cache/' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='node_modules/' \
            --exclude='.idea/' \
            --exclude='.vscode/' \
            --filter='- .env' \
            --filter='- .env.*' \
            --filter='+ .env.example' \
            source/ clean/

          mkdir -p clean/.github/workflows
          cp bootstrap/.github/workflows/olv-clean-migration.yml clean/.github/workflows/olv-clean-migration.yml

          cat >> clean/.gitignore <<'EOF'

          # Local/private development files
          .env
          .env.*
          !.env.example
          *.log
          *.tmp
          *.bak
          *.swp
          *.swo
          .DS_Store
          Thumbs.db
          desktop.ini
          __pycache__/
          .pytest_cache/
          .mypy_cache/
          .ruff_cache/
          .venv/
          venv/
          EOF

          echo "Files in clean tree: $(find clean -type f | wc -l)"
          echo "Approximate size (MiB): $(du -sm clean | cut -f1)"

      - name: Verify AGPL-3.0-or-later license
        run: |
          set -euo pipefail
          test -f clean/LICENSE || { echo "::error::No existe clean/LICENSE"; exit 1; }
          grep -Eqi 'GNU AFFERO GENERAL PUBLIC LICENSE' clean/LICENSE
          grep -Eqi 'version 3' clean/LICENSE
          grep -Eqi 'or \(at your option\) any later version' clean/LICENSE || {
            echo "::error::LICENSE no confirma AGPL v3 o posterior."
            exit 1
          }
          echo "AGPL-3.0-or-later license text verified."

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          VERSION="$(curl -fsSL https://api.github.com/repos/gitleaks/gitleaks/releases/latest | python3 -c 'import json,sys; print(json.load(sys.stdin)["tag_name"])')"
          ARCHIVE="gitleaks_${VERSION#v}_linux_x64.tar.gz"
          curl -fsSLo /tmp/gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/${ARCHIVE}"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: |
          set -euo pipefail
          gitleaks dir clean --redact --exit-code 1

      - name: Scan for personal and local traces
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re, sys

          root = Path("clean")
          checks = [
              ("Windows user profile path", re.compile(r"(?i)\b[A-Z]:\\Users\\[^\\\s\"'<>]+")),
              ("Unix home directory path", re.compile(r"(?<!\w)/home/[^/\s\"'<>]+")),
              ("Possible private key", re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----")),
              ("Email address", re.compile(r"(?i)\b[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}\b")),
              ("Private IPv4 address", re.compile(r"\b(?:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|172\.(?:1[6-9]|2\d|3[01])\.\d{1,3}\.\d{1,3})\b")),
          ]
          allowed_email = "289360693+noocoks@users.noreply.github.com"
          findings = []
          for path in root.rglob("*"):
              if not path.is_file() or path.stat().st_size > 5 * 1024 * 1024:
                  continue
              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for label, pattern in checks:
                  matches = list(pattern.finditer(content))
                  if label == "Email address":
                      matches = [m for m in matches if m.group(0).lower() != allowed_email]
                  if matches:
                      findings.append((str(path), label))
          if findings:
              for path, label in findings:
                  print(f"Potential personal/local trace: {label} in {path}")
              print("Revisa esos archivos en el repositorio privado y vuelve a ejecutar.")
              sys.exit(1)
          print("No se detectaron correos, rutas locales ni IP privadas en archivos de texto.")
          PY

      - name: Prepare new one-commit history
        run: |
          set -euo pipefail
          git -C clean init -b "$TARGET_BRANCH"
          git -C clean config user.name "Noocoks"
          git -C clean config user.email "289360693+noocoks@users.noreply.github.com"
          git -C clean add --all
          if git -C clean diff --cached --name-only | grep -E '(^|/)(\.env($|\.)|id_rsa|id_ed25519|credentials\.json|secrets\.json)$|\.(pfx|p12|pem|key)$'; then
            echo "::error::Hay archivos con nombres típicos de secretos en staging."
            exit 1
          fi
          git -C clean commit -m "Initial public release: OLV 0.4.0"
          test "$(git -C clean rev-list --count HEAD)" = "1"
          echo "New root commit: $(git -C clean rev-parse HEAD)"
          echo "Tracked files: $(git -C clean ls-files | wc -l)"

      - name: Prepare review copy without Git internals
        run: |
          mkdir review
          rsync -a --exclude='.git/' clean/ review/

      - name: Upload clean tree for review
        uses: actions/upload-artifact@v4
        with:
          name: OLV-clean-publication-review
          path: review/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      - name: Review-only mode
        if: ${{ inputs.publish_now != true }}
        run: |
          echo "AUDIT PASSED. No se ha publicado el proyecto."
          echo "Descarga el artefacto OLV-clean-publication-review y revisa su contenido."

      - name: Require explicit publication confirmation
        if: ${{ inputs.publish_now == true }}
        run: |
          if [ "$CONFIRMATION" != "PUBLISH" ]; then
            echo "::error::Para publicar, confirmation debe ser exactamente PUBLISH."
            exit 1
          fi

      - name: Publish clean history
        if: ${{ inputs.publish_now == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C clean remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C clean push --force-with-lease=refs/heads/main:${GITHUB_SHA} -u origin HEAD:refs/heads/main

      - name: Verify public branch
        if: ${{ inputs.publish_now == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          remote_sha="$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | awk '{print $1}')"
          local_sha="$(git -C clean rev-parse HEAD)"
          test -n "$remote_sha"
          test "$remote_sha" = "$local_sha"
          echo "Verified public main at $remote_sha"
