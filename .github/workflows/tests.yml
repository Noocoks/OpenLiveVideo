name: Tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q shortsfactory tests
      - run: python -m pytest -q
      - name: Build wheel and verify packaged brand asset
        run: |
          python -m pip wheel --no-deps -w dist .
          python -c "import glob, zipfile; z=zipfile.ZipFile(glob.glob('dist/*.whl')[0]); assert 'shortsfactory/assets/branding/olv-master.svg' in z.namelist()"
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - name: Build Windows installer and portable package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Build Linux DEB and portable package
        if: runner.os == 'Linux'
        run: bash scripts/build_linux.sh
      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OLV-${{ runner.os }}-Python-${{ matrix.python-version }}
          path: dist/
          if-no-files-found: error
